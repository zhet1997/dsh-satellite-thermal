[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dsh-satellite-thermal-executor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "psutil>=6,<8"]
[project.optional-dependencies]
test = ["httpx>=0.27,<1"]
[project.scripts]
thermal-nx-worker = "thermal_executor.app:main"
[tool.setuptools.packages.find]
where = ["."]
include = ["thermal_executor*"]
[tool.setuptools.package-data]
thermal_executor = ["journals/*.py", "journals/vendor/*.py", "journals/vendor/LICENSE"]
